name: Scrape teplota Vltavy

on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repozitáře
        uses: actions/checkout@v4

      - name: Nastavení Pythonu
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Spustit scraper
        run: python scraper/scrape_vltava.py

      - name: Commit a push výsledků
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/vltava.json
          git diff --cached --quiet || git commit -m "data: aktualizace teploty Vltavy [skip ci]"
          git push

      - name: Spustit testy a odeslat na Discord
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python scraper/test_vltava.py
